name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # لا يُنشر شيء لم يجتز الاختبارات وعقود اللون
      - name: الاختبارات
        run: npm test
      - name: عقود اللون
        run: npm run palette

      # التطبيق ثابت ويستورد وحدات ESM مباشرة، فلا خطوة تجميع.
      # نجمع ما يحتاجه المتصفح فقط: الصفحة، الأنماط، النصوص البرمجية، والنواة.
      - name: تجميع مخرجات النشر
        run: |
          mkdir -p _site
          cp index.html icon.svg manifest.webmanifest _site/
          cp -r web _site/web
          cp -r src _site/src
          cp README.md _site/README.md
          touch _site/.nojekyll

      # ملاحظة: يجب تفعيل Pages مرة واحدة يدويًا من
      # Settings ← Pages ← Source: GitHub Actions.
      # لا يملك GITHUB_TOKEN صلاحية إنشاء الموقع، فلا نمرر enablement هنا.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
